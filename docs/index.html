<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Twitch Colony — démo simulation</title><link rel="stylesheet" href="style.css">
<style>.ctl{padding:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:#fff}button{padding:6px 10px}#ov{transform-origin:0 0}</style></head><body class="sim-bg">
<div class="ctl"><b>Démo simulation</b> · Pseudo <input id="u" value="Viewer1" size="10">
<button data-c="!bois">!bois [B]</button><button data-c="!pierre">!pierre [P]</button><button data-c="!chasse">!chasse [C]</button>
<button data-c="!construire hutte">!construire hutte</button><button data-t="vote">Lancer un vote [V]</button>
<button data-c="!vote hutte">!vote hutte</button><button data-c="!vote ferme">!vote ferme</button><button data-c="!vote carriere">!vote carriere</button>
<button data-bits="100">100 Bits [1]</button><button data-bits="500">500 Bits [5]</button><button data-bits="5000">5000 Bits</button>
<button data-t="sub">Sub [S]</button><button data-c="!optout">!optout</button><button data-t="reset">Nouvelle session</button>
<label><input type="checkbox" id="rnd"> pseudo aléatoire</label> <a href="confidentialite.html" style="color:#c9b6ff">Confidentialité</a></div>
<div id="ov"><div id="map"></div><div id="res" class="panel"></div><div id="vote" class="panel"></div><div id="lb" class="panel"></div><div id="log" class="panel"></div>
<div id="foot">« Les Bits permettent à la communauté d'influencer la partie en direct. Ils ne donnent accès à aucun objet, compte, service ou avantage en dehors de ce stream. »</div></div>
<script>window.STANDALONE=true</script><script src="game.js"></script><script src="overlay.js"></script>
<script>
const game=new TwitchColony.Colony(); window.game=game;
const draw=()=>render(game.state());
const send=e=>{ const u=document.getElementById('u'); if(document.getElementById('rnd').checked) u.value='Viewer'+Math.floor(Math.random()*50);
  if(e.type==='chat') game.chat(u.value,e.text); else if(e.type==='cheer') game.cheer(u.value,e.bits); else if(e.type==='sub') game.sub(u.value);
  else if(e.type==='vote') game.autoVote(); else if(e.type==='reset') game.reset(); draw(); };
document.querySelectorAll('button').forEach(b=>b.onclick=()=>b.dataset.c?send({type:'chat',text:b.dataset.c}):b.dataset.bits?send({type:'cheer',bits:+b.dataset.bits}):send({type:b.dataset.t}));
const K={b:{type:'chat',text:'!bois'},p:{type:'chat',text:'!pierre'},c:{type:'chat',text:'!chasse'},v:{type:'vote'},1:{type:'cheer',bits:100},5:{type:'cheer',bits:500},s:{type:'sub'}};
addEventListener('keydown',e=>{ if(e.target.tagName!=='INPUT'&&K[e.key]) send(K[e.key]); });
setInterval(()=>{ game.tick(); draw(); },1000);
setInterval(()=>game.autoVote(),180000);
const fit=()=>{ const k=Math.min(1,(innerWidth-10)/1280); document.getElementById('ov').style.transform='scale('+k+')'; }; addEventListener('resize',fit); fit(); draw();
if(location.hash==='#autotest'){ send({type:'chat',text:'!bois'}); send({type:'cheer',bits:500}); send({type:'sub'}); }
</script></body></html>
