<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Twitch Colony — village 3D</title><link rel="stylesheet" href="style.css"><link rel="icon" href="../favicon.svg"></head><body>
<canvas id="c"></canvas><div id="labels"></div>
<div class="hud">
 <div class="card res" id="res"></div>
 <div class="card goal" id="goal"></div>
 <div class="card vote" id="vote"></div>
 <div class="card alert" id="alert"></div>
 <div class="card ctl" id="ctl"><button id="fold" class="fold" aria-expanded="true" title="Masquer / afficher les commandes">▾ Masquer</button>
  <div class="row">
   <button data-c="!bois" title="!bois">🪵<span> Bois</span></button><button data-c="!pierre" title="!pierre">🪨<span> Pierre</span></button><button data-c="!chasse" title="!chasse">🍖<span> Chasse</span></button>
   <button data-b="hutte" title="Construire une hutte">🛖<span> Hutte</span></button><button data-b="ferme" title="Construire une ferme">🌾<span> Ferme</span></button><button data-b="carriere" title="Construire une carrière">⛏️<span> Carrière</span></button><button data-b="tour" title="Construire une tour">🏰<span> Tour</span></button>
   <button data-bits="500" class="gold" title="500 Bits : Phare">💎<span> 500 Bits</span></button><button data-t="sub" class="gold" title="Sub : +1 villageois">⭐<span> Sub</span></button>
   <button id="home" title="Recentrer sur le village"><i data-i="maison"></i><span> Centrer</span></button><button id="overview" title="Vue d'ensemble de la carte"><i data-i="cube"></i><span> Carte</span></button><button id="rl" aria-label="Pivoter à gauche" title="Pivoter à gauche"><i data-i="left"></i><span> Pivoter</span></button><button id="rr" aria-label="Pivoter à droite" title="Pivoter à droite"><i data-i="right"></i><span> Pivoter</span></button><button data-t="reset" title="Nouvelle partie (nouvelle seed)"><i data-i="reset"></i><span> Nouvelle</span></button>
  </div>
  <small class="help">Partie <b id="seed"></b> · glisser / WASD / flèches : déplacer · molette / pincer : zoom · Q/E : pivoter · <span id="msg"></span></small>
 </div>
 <div class="legal">Les Bits permettent à la communauté d'influencer la partie en direct. Ils ne donnent accès à aucun objet, compte, service ou avantage en dehors de ce stream.</div>
</div>
<div id="fatal" role="alert" hidden></div>
<script>
// Messages d'erreur visibles (au lieu de panneaux vides), y compris sur les navigateurs intégrés d'Android.
window.showFatal=function(m){ var f=document.getElementById('fatal'); if(!f) return; f.hidden=false; f.innerHTML='<b>Le village 3D n\'a pas pu démarrer.</b><br>'+String(m).replace(/</g,'&lt;')+'<br><a href="" onclick="location.reload();return false">Recharger</a> · <a href="../">Version 2D</a>'; };
window.addEventListener('error',function(e){ if(e.target&&e.target!==window&&(e.target.src||e.target.href)){ window.showFatal('Fichier introuvable : '+(e.target.src||e.target.href)); } else if(e.message&&!/obsolète/.test(e.message)){ window.showFatal(e.message); } },true);
window.addEventListener('unhandledrejection',function(e){ window.showFatal(e.reason&&e.reason.message||String(e.reason)); });
setTimeout(function(){ if(!window.__state) window.showFatal('Le jeu ne s\'est pas initialisé (WebGL ou modules JavaScript non pris en charge par ce navigateur ?). Essayez Chrome ou Firefox.'); },8000);
</script>
<script nomodule>window.showFatal('Ce navigateur ne prend pas en charge les modules JavaScript. Ouvrez la page dans Chrome, Firefox ou Safari récents.');</script>
<script src="../icons.js"></script><script src="../game.js"></script><script src="../driver-server.js"></script>
<script type="module" src="main.js"></script></body></html>
